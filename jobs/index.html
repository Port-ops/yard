<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs at 2FF Logistics · Savannah, GA</title>
<meta name="description" content="Open jobs at 2FF Logistics and 1 Stop Logistics in Savannah, GA: CDL-A port drayage drivers, owner-operators, diesel mechanics and yard crew. Apply in 2 minutes.">
<link rel="canonical" href="https://yard.2f-logistics.com/jobs/">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<meta property="og:title" content="Now hiring · 2FF Logistics, Savannah GA">
<meta property="og:description" content="Port drayage drivers, owner-operators, mechanics and yard crew. Apply in 2 minutes.">
<meta property="og:image" content="https://yard.2f-logistics.com/jobs/img/general.jpg">
<style>
:root{--navy:#1F2A5C;--navy2:#2b3a7a;--red:#C8102E;--ink:#1f2933;--mut:#5b6474;--line:#e3e6ee;--bg:#f4f5f8;--card:#fff;--ok:#1F6B29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lato,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--navy)}
header{background:var(--navy);color:#fff;border-bottom:5px solid var(--red)}
.hw{max-width:880px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;gap:14px}
.hw img{height:46px;background:#fff;border-radius:8px;padding:4px 8px}
.hw b{font:600 22px/1.1 Oswald,Arial Narrow,sans-serif;letter-spacing:.5px;text-transform:uppercase;display:block}
.hw span{font-size:13px;opacity:.8}
main{max-width:880px;margin:0 auto;padding:22px 16px 60px}
h1{font:600 34px/1.1 Oswald,Arial Narrow,sans-serif;text-transform:uppercase;margin:6px 0 6px;color:var(--navy)}
h2{font:600 22px/1.2 Oswald,Arial Narrow,sans-serif;text-transform:uppercase;color:var(--navy);margin:26px 0 8px}
.lead{color:var(--mut);margin:0 0 18px}
.job{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:16px 18px;margin:12px 0;text-decoration:none;color:inherit}
.job:hover{border-color:var(--navy2);border-left-color:var(--red)}
.job h3{margin:0 0 4px;font:600 21px/1.2 Oswald,Arial Narrow,sans-serif;color:var(--navy);text-transform:uppercase}
.meta{color:var(--mut);font-size:14px}
.pay{font-weight:700;color:var(--ok)}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:#eef0f7;color:var(--navy);border-radius:20px;padding:2px 10px;margin-right:6px}
.go{display:inline-block;margin-top:10px;font-weight:700;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin:14px 0}
.desc p{margin:0 0 10px}.desc ul{margin:6px 0 12px;padding-left:20px}
form label{display:block;font-weight:700;font-size:14px;margin:14px 0 5px}
form .hint{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;font:16px Lato,system-ui,sans-serif;padding:11px 12px;border:1px solid #c9cdd8;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #c7cdea;border-color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.yn{display:flex;gap:8px}.yn label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c9cdd8;border-radius:8px;padding:10px;font-weight:700;cursor:pointer}
.yn input{width:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400 !important;font-size:14px !important}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.btn{display:inline-block;width:100%;margin-top:20px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:15px;font:600 20px Oswald,Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.btn:disabled{opacity:.6}
.err{color:var(--red);font-weight:700;margin-top:12px;min-height:1em}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.done{border-left:5px solid var(--ok)}
.done .btn{background:var(--navy);text-decoration:none;text-align:center}
.back{display:inline-block;margin:4px 0 6px;font-weight:700;text-decoration:none}
.fine{color:var(--mut);font-size:13px;margin-top:26px}
.empty{background:var(--card);border:1px dashed #c9cdd8;border-radius:10px;padding:22px;text-align:center;color:var(--mut)}
@media (max-width:520px){h1{font-size:28px}.two{grid-template-columns:1fr}.hw img{height:38px}}
</style>
</head>
<body>
<header><div class="hw"><img src="/logo.png" alt="2FF Logistics · America 1"><div><b>Jobs at 2FF Logistics</b><span>Savannah port drayage · 116 Gulfstream Rd, Savannah GA</span></div></div></header>
<main id="app"><p class="meta">Loading open jobs…</p></main>
<script>
(function(){

var ORG={'2FF':{name:'2FF Logistics LLC',site:'https://www.2f-logistics.com',logo:'https://yard.2f-logistics.com/logo.png'},'1Stop':{name:'1 Stop Logistics LLC',site:'https://yard.2f-logistics.com/jobs/',logo:'https://yard.2f-logistics.com/jobs/img/1stop-general.jpg'}};
var KIND={company_driver:'CDL-A driver',owner_operator:'Owner-operator',mechanic:'Mechanic',yard:'Yard crew',office:'Office',other:'Job'};
var EMP={FULL_TIME:'Full time',PART_TIME:'Part time',CONTRACTOR:'Contractor (1099)',TEMPORARY:'Temporary'};
var app=document.getElementById('app'),q=new URLSearchParams(location.search),slug=q.get('j'),ref=q.get('ref')||q.get('utm_source')||'',t0=Date.now();

function money(n){return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0})}
function pay(j){if(j.pay_min==null)return '';var u=(j.pay_unit||'WEEK').toLowerCase();return money(j.pay_min)+(j.pay_max&&Number(j.pay_max)!==Number(j.pay_min)?'–'+money(j.pay_max):'')+' per '+u+(j.pay_note?' ('+j.pay_note+')':'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function paras(s){return String(s||'').split(/\n{2,}/).map(function(p){return p.trim()?'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>':''}).join('')}
var EEO='2FF Logistics and 1 Stop Logistics are equal opportunity employers. We consider all qualified applicants without regard to race, color, religion, sex, national origin, age, disability, veteran status or any other protected status.';
function descHtml(j){return paras(j.summary)+paras(j.description)+((j.requirements||[]).length?'<p><strong>What you need</strong></p><ul>'+j.requirements.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ul>':'')+(j.benefits?'<p><strong>What you get</strong></p>'+paras(j.benefits):'')+'<p>'+EEO+'</p>'}

  if(j.valid_through)d.validThrough=j.valid_through;

  var s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(d);document.head.append(s)}

function list(){document.title='Jobs at 2FF Logistics · Savannah, GA';
  get(API+'?list=1').then(function(d){app.textContent='';app.append(h('h1',{text:'Now hiring in Savannah'}),h('p',{class:'lead',text:'Port drayage work out of our yard at 116 Gulfstream Rd, near the Garden City terminal. Pick a job and apply in about 2 minutes. We call you back.'}));
    var J=(d&&d.jobs)||[];if(!J.length){app.append(h('div',{class:'empty',html:'No jobs are open right now. Call <a href="tel:+18779402647">(877) 940-2647</a> and leave your name.'}));return}
    J.forEach(function(j){var a=h('a',{class:'job',href:'?j='+encodeURIComponent(j.slug)+(ref?'&ref='+encodeURIComponent(ref):'')});
      a.append(h('h3',{text:j.title}),h('div',{class:'meta'},[h('span',{class:'chip',text:KIND[j.kind]||'Job'}),document.createTextNode((EMP[j.employment_type]||'')+' · '+j.city+', '+j.state)]));
      if(pay(j))a.append(h('div',{class:'pay',text:pay(j)}));if(j.summary)a.append(h('div',{text:j.summary}));a.append(h('span',{class:'go',text:'View and apply →'}));app.append(a)});
    app.append(h('p',{class:'fine',text:EEO}))}).catch(function(){app.innerHTML='<div class="empty">Could not load jobs. Call <a href="tel:+18779402647">(877) 940-2647</a>.</div>'})}
function yn(name,label){var w=h('div'),l=h('label',{text:label}),r=h('div',{class:'yn'});['yes','no'].forEach(function(v){var i=h('input',{type:'radio',name:name,value:v}),b=h('label',{},[i,document.createTextNode(v==='yes'?'Yes':'No')]);r.append(b)});w.append(l,r);return w}

function detail(){get(API+'?j='+encodeURIComponent(slug)).then(function(d){app.textContent='';
  app.append(h('a',{class:'back',href:'./'+(ref?'?ref='+encodeURIComponent(ref):''),text:'← All jobs'}));
  if(!d||!d.ok){app.append(h('div',{class:'empty',text:(d&&d.error)||'This job is closed.'}));return}
  var j=d.job;document.title=j.title+' · '+j.city+', '+j.state+' · '+((ORG[j.brand]||ORG['2FF']).name);ld(j);
  app.append(h('h1',{text:j.title}),h('div',{class:'meta'},[h('span',{class:'chip',text:KIND[j.kind]||'Job'}),document.createTextNode((EMP[j.employment_type]||'')+' · '+(j.street?j.street+', ':'')+j.city+', '+j.state)]));
  if(pay(j))app.append(h('p',{class:'pay',text:pay(j)}));
  app.append(h('div',{class:'card desc',html:descHtml(j)}));
  var drv=j.kind==='company_driver'||j.kind==='owner_operator',f=h('form',{class:'card',novalidate:''}),err=h('div',{class:'err',role:'alert'});

  f.append(h('h2',{text:'Apply in 2 minutes'}),h('div',{class:'two'},[field('First name',I('first_name','text','given-name')),field('Last name',I('last_name','text','family-name'))]),
    h('div',{class:'two'},[field('Mobile phone',I('phone','tel','tel','(912) 555-0123')),field('Email',I('email','email','email'),'(optional)')]),
    h('div',{class:'two'},[field('City',I('city','text','address-level2')),field('State',I('state','text','address-level1','GA'))]));
  if(drv){var cls=h('select',{id:'cdl_class',name:'cdl_class'});[['','Choose'],['A','Class A'],['B','Class B'],['none','No CDL yet']].forEach(function(o){cls.append(h('option',{value:o[0],text:o[1]}))});
    f.append(h('div',{class:'two'},[field('CDL',cls),field('Years driving with a CDL',I('cdl_years','number','off','2'))]),h('div',{class:'two'},[yn('hazmat','Hazmat endorsement?'),yn('twic','TWIC card?')]));
    if(j.kind==='owner_operator')f.append(yn('own_truck','Do you own or lease your truck?'))}
  var msg=h('textarea',{id:'message',name:'message',rows:'3',placeholder:drv?'Experience, last company, best time to call':'Experience, best time to call'});f.append(field('Anything we should know?',msg,'(optional)'));
  var sms=h('input',{type:'checkbox',id:'sms_ok',name:'sms_ok'});f.append(h('label',{class:'check',for:'sms_ok'},[sms,document.createTextNode('Text me about this job at the number above. Message and data rates may apply. Reply STOP to opt out.')]));
  f.append(h('div',{class:'hp','aria-hidden':'true'},[h('label',{for:'website',text:'Website'}),h('input',{id:'website',name:'website',tabindex:'-1',autocomplete:'off'})]));
  var btn=h('button',{class:'btn',type:'submit',text:'Send my application'});f.append(btn,err,h('p',{class:'fine',text:'We use your information only to contact you about jobs at 2FF Logistics and 1 Stop Logistics. '+EEO}));
  f.addEventListener('submit',function(e){e.preventDefault();err.textContent='';var fd=new FormData(f),o={job:j.slug,t:Date.now()-t0,ref:ref};fd.forEach(function(v,k){o[k]=v});o.sms_ok=sms.checked;

    btn.disabled=true;btn.textContent='Sending…';

  app.append(f)}).catch(function(){app.innerHTML='<div class="empty">Could not load this job. Call <a href="tel:+18779402647">(877) 940-2647</a>.</div>'})}
slug?detail():list();
})();

</html>
