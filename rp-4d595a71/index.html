<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Richard's HQ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#0d1117;--card:#161b24;--ink:#eef1f6;--mut:#8d97a8;--line:#262d3a;--navy:#f5b524;--red:#f5b524;--acc:#f5b524;--ok:#3ccf7e;--warn:#f5b524;--bad:#ff5f5f;--chip:#1f2532;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1b1d22;--mut:#6b6f78;--line:#e3ded2;--navy:#9a6a00;--red:#c98a00;--acc:#c98a00;--ok:#18864b;--warn:#a36300;--bad:#c62f2f;--chip:#ece6d8;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Lato,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding-block:12px}
.mono{width:40px;height:40px;border-radius:11px;background:var(--acc);color:#0d1117;display:grid;place-items:center;font:600 17px/1 Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em;flex:none}
.hd h1{font:600 21px/1 Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}
.hd .sub{font:500 11.5px/1.3 "IBM Plex Mono",monospace;color:var(--mut);margin-top:3px}
.gate{display:inline-block;margin-left:auto;padding:5px 9px;border-radius:99px;font:600 11px/1.2 "IBM Plex Mono",monospace;text-align:center;max-width:46%}
.g-open{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}.g-soon{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}.g-closed{background:var(--chip);color:var(--mut)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
nav.tabs button{border:0;background:none;color:var(--mut);padding:9px 0 8px;cursor:pointer;display:grid;justify-items:center;gap:3px;font:600 9.5px/1 Lato,sans-serif;letter-spacing:.03em;text-transform:uppercase}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
main{padding-block:16px calc(90px + env(safe-area-inset-bottom,0px))}
section[hidden]{display:none}
h2{font:600 17px/1.2 Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:24px 0 10px;color:var(--ink);text-wrap:balance}
h2:first-child{margin-top:0}
h2 small{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--mut);text-transform:none;letter-spacing:0;margin-left:6px}
.q{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:14px;padding:12px 14px;margin-bottom:14px;color:var(--mut);font-size:14.5px}
.q b{color:var(--ink)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-width:0}
.tile:active{transform:scale(.98)}
.tile .k{font:500 10px/1.2 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--acc)}
.tile .n{font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.tile .d{font-size:12.5px;color:var(--mut);line-height:1.35}
.cols{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.card h3{font:600 16px/1.2 Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3 .when{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--mut);text-transform:none;letter-spacing:0}
.card h3 .cnt{margin-left:auto;font:500 12px/1 "IBM Plex Mono",monospace;color:var(--acc)}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk li{border-top:1px solid var(--line)}
ul.chk label{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;cursor:pointer;font-size:15px}
ul.chk input{width:22px;height:22px;margin-top:0;flex:none;accent-color:var(--ok)}
ul.chk input:checked+span{color:var(--mut);text-decoration:line-through}
.reset{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--mut);border-radius:9px;padding:6px 12px;cursor:pointer;margin-top:8px}
.tw{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:14px}
thead{display:none}
tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
tr:last-child{border-bottom:0}
td{display:block;padding:3px 14px;border:0}
td:first-child{font-weight:700}
td.t{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--acc);font-weight:500}
.stack td.t{padding-top:6px}
.stack td:nth-child(2){font-weight:700}
.pill{display:inline-block;font:700 11px/1 "IBM Plex Mono",monospace;padding:5px 8px;border-radius:99px;white-space:nowrap;margin-top:4px}
.p-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.p-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.p-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.p-mut{background:var(--chip);color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:10px 2px 0}
.who{font-size:12.5px;color:var(--mut)}
footer{font-size:12px;color:var(--mut);text-align:center;padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px}
#lock[hidden]{display:none}
.brief{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.brief h3{margin:0;font:600 16px/1.2 Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.brief h3 small{font:500 11px "IBM Plex Mono",monospace;color:var(--mut);text-transform:none;letter-spacing:0}
.bl{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;text-decoration:none;padding:5px 0;border-top:1px solid var(--line)}
.bl:first-of-type{border-top:0}
.bl i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--ok)}
.bl i.red{background:var(--bad)}.bl i.amber{background:var(--warn)}
.sres[hidden]{display:none}
.srch{margin-top:14px;width:100%;font:16px Lato,sans-serif;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sres{display:grid;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sres a{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;min-height:46px;align-items:center}
.sres a:first-child{border-top:0}
.sres a span,.lib a span{font:500 10.5px "IBM Plex Mono",monospace;color:var(--mut);text-transform:uppercase;white-space:nowrap}
.pinx{display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:66px;min-width:0}
.pinx b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:#fff;font:600 13px Oswald,sans-serif;flex:none}
.pinx div{font-weight:700;line-height:1.15;overflow-wrap:anywhere}.pinx small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.ask{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.ask textarea{width:100%;min-height:90px;font:16px/1.45 Lato,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;font:600 13.5px Lato,sans-serif;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.chip.on{background:var(--acc);color:#0d1117;border-color:var(--acc)}
.gobtn{font:700 15px Lato,sans-serif;border:0;background:var(--acc);color:#0d1117;border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer}
.ghost{font:600 14px Lato,sans-serif;border:1px solid var(--line);background:none;color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer}
.lib{display:grid;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lib a{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;min-height:46px;align-items:center}
.lib a:first-child{border-top:0}

#lock .box{width:100%;max-width:320px;text-align:center;display:grid;gap:14px;justify-items:center}
#lock p{color:var(--mut);margin:0;font-size:14px}
#lock input{width:100%;font:600 26px/1 "IBM Plex Mono",monospace;letter-spacing:.4em;text-align:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#lock button{width:100%;font:600 15px/1 Lato,sans-serif;padding:15px;border-radius:14px;border:0;background:var(--acc);color:#0d1117;cursor:pointer}
#lock .err{color:var(--bad);min-height:1.2em;font-size:13px}
</style>
</head>
<body>
<div id="lock"><div class="box"><div class="mono" style="width:64px;height:64px;font-size:26px;border-radius:16px">HQ</div>
<p id="lockMsg">Private. Sign in as rp@2f-logistics.com</p>
<div id="lockBody"></div><div class="err" id="pinErr"></div></div></div>
<header>
 <div class="wrap hd">
  <div class="mono">HQ</div>
  <div><h1>Richard's HQ</h1><div class="sub" id="now">—</div></div>
  <span id="gate" class="gate g-closed">Gates —</span>
 </div>
</header><nav class="tabs"><div class="wrap" id="tabs">
 <button data-t="apps" class="on"><svg viewBox="0 0 24 24"><path d="M5 19l4-1 10-10-3-3L6 15z"/><path d="M14 6l3 3"/><circle cx="18.5" cy="5.5" r="1.5"/></svg>Launch</button>
 <button data-t="today"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Today</button>

 <button data-t="deadlines"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Dates</button>
 <button data-t="kpis"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>KPIs</button>
 <button data-t="port"><svg viewBox="0 0 24 24"><path d="M2 20h20M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>Port</button>
 <button data-t="week"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Friday</button>
</div></nav>

<main class="wrap" id="app" hidden>
<section id="apps"></section><section id="today" hidden></section><section id="deadlines" hidden></section>
<section id="kpis" hidden></section><section id="port" hidden></section><section id="week" hidden></section>
<p class="note" style="text-align:center;margin-top:28px">Private · only rp@ with your authenticator · Carter learns from your check-offs <button class="reset" id="signout">Sign out</button></p>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const URL_='https://lzwidcwiejowjhgzkcxo.supabase.co',KEY='sb_publishable_EKl8WQgmfocO7TqKJGqE5A_TRxy-LcP',EMAIL='rp@2f-logistics.com';
const sb=createClient(URL_,KEY,{auth:{storageKey:'rphq-auth',storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=(t,a={},h='')=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);if(h)e.innerHTML=h;return e};

/* clock + gate (no business data) */
function sav(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return o}
function tick(){const o=sav(),t=+o.hour*60+ +o.minute,dow=o.weekday;
 $('#now').textContent=new Date().toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' · Savannah';
 let open=0,close=0,cut=0;if(['Mon','Tue','Wed','Thu','Fri'].includes(dow)){open=240;close=1080;cut=990}else if(dow==='Sat'){open=480;close=1020;cut=930}
 const g=$('#gate');let l;if(!close||t<open||t>=close){g.className='gate g-closed';l=close&&t<open?'Gate 4 opens '+(open/60)+':00':'Gates closed'}
 else if(t>=cut){g.className='gate g-soon';l='Drop-offs till '+(dow==='Sat'?'4:00':'5:00')}else if(cut-t<=60){g.className='gate g-soon';l='Cutoff in '+(cut-t)+' min'}
 else{g.className='gate g-open';l='Gates open · cutoff '+(dow==='Sat'?'3:30':'4:30')}g.textContent=l}
tick();setInterval(tick,30000);
const o0=sav(),TODAY=o0.year+'-'+o0.month+'-'+o0.day,d0=new Date(+o0.year,+o0.month-1,+o0.day);
const fri=new Date(d0);fri.setDate(d0.getDate()-((d0.getDay()+2)%7));const WEEK=fri.getFullYear()+'-'+String(fri.getMonth()+1).padStart(2,'0')+'-'+String(fri.getDate()).padStart(2,'0');

/* sign-in: password + authenticator (aal2), same owner login as DockRelay finance */
async function gate(){
 const box=$('#lockBody'),err=$('#pinErr');box.innerHTML='';err.textContent='';
 const {data:{session}}=await sb.auth.getSession();
 if(!session){box.innerHTML='<input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="letter-spacing:normal;font-size:17px"><button id="go">Sign in</button>';
  const go=async()=>{err.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:EMAIL,password:$('#pw').value});$('#pw').value='';if(error){err.textContent=error.message;return}gate()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#pw').focus();return}
 const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
 if(aal.currentLevel!=='aal2'){const {data:f}=await sb.auth.mfa.listFactors();const t=(f&&f.totp||[]).find(x=>x.status==='verified');
  if(!t){err.textContent='No authenticator set up yet. Set it up once in DockRelay → Finance, then come back.';return}
  $('#lockMsg').textContent='Authenticator code';
  box.innerHTML='<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code"><button id="go">Unlock</button><button id="out" class="reset" style="width:auto;background:none;color:var(--mut)">Cancel</button>';
  const go=async()=>{err.textContent='Checking…';const {error}=await sb.auth.mfa.challengeAndVerify({factorId:t.id,code:$('#code').value.trim()});$('#code').value='';if(error){err.textContent=error.message;return}gate()};
  $('#go').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()};$('#out').onclick=async()=>{await sb.auth.signOut();$('#lockMsg').textContent='Private. Sign in as rp@2f-logistics.com';gate()};$('#code').focus();return}
 load()}
$('#signout').onclick=async()=>{await sb.auth.signOut();location.reload()};

let DOC=null,CH={},BR=[],DW=0;
async function load(){const {data,error}=await sb.rpc('hq_get',{p_day:TODAY,p_week:WEEK});
 if(error){$('#lock').hidden=false;$('#app').hidden=true;$('#pinErr').textContent=/authorized|aal|JWT/i.test(error.message)?'Session ended. Sign in again.':error.message;if(/authorized|aal|JWT/i.test(error.message)){await sb.auth.signOut();gate()}return}
 DOC=data.doc;CH=data.checks||{};BR=data.briefs||[];DW=data.decisions_waiting||0;$('#lock').hidden=true;$('#app').hidden=false;render()}

/* tabs */
const tabs=[...document.querySelectorAll('#tabs button')];
function show(t){if(!document.getElementById(t)||t==='app')t='today';tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('#app>section').forEach(s=>s.hidden=s.id!==t);try{localStorage.setItem('hq-tab',t)}catch(e){}}
tabs.forEach(b=>b.onclick=()=>{show(b.dataset.t);history.replaceState(null,'','#'+b.dataset.t);scrollTo(0,0)});
let start='apps';try{start=location.hash.slice(1)||localStorage.getItem('hq-tab')||'apps'}catch(e){}show(start);

const tiles=a=>'<div class="grid">'+a.map(x=>'<a class="tile" href="'+esc(x[3])+'" target="_blank" rel="noopener"><div class="k">'+esc(x[0])+'</div><div class="n">'+esc(x[1])+'</div><div class="d">'+esc(x[2])+'</div></a>').join('')+'</div>';
function list(L){const per=L.period==='week'?WEEK:TODAY;const c=mk('div',{class:'card'});
 const key=i=>L.id+':'+per+':'+i;
 c.innerHTML='<h3>'+esc(L.title)+' <span class="when">'+esc(L.when)+'</span><span class="cnt"></span></h3><div class="bar"><i></i></div><ul class="chk">'+L.items.map((x,i)=>'<li><label><input type="checkbox" data-i="'+i+'"'+(CH[key(i)]?' checked':'')+'><span>'+esc(x)+'</span></label></li>').join('')+'</ul>';
 const upd=()=>{const n=L.items.filter((_,i)=>CH[key(i)]).length;c.querySelector('.cnt').textContent=n+' / '+L.items.length;c.querySelector('.bar i').style.width=(100*n/L.items.length)+'%'};
 c.querySelectorAll('input').forEach(inp=>inp.onchange=async()=>{const i=+inp.dataset.i;CH[key(i)]=inp.checked;upd();
  const {error}=await sb.rpc('hq_check',{p_list:L.id,p_period:per,p_idx:i,p_item:L.items[i],p_done:inp.checked});
  if(error){inp.checked=!inp.checked;CH[key(i)]=inp.checked;upd();alert('Not saved: '+error.message)}});
 upd();return c}
function nextOf(a){return a.map(s=>new Date(s+'T00:00:00')).filter(d=>d>=d0).sort((x,y)=>x-y)[0]}
function bizDay(d){d=new Date(d);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d}
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function render(){const D=DOC,Y=d0.getFullYear();
 const T=$('#today');T.innerHTML='<div class="q">'+esc(D.intro)+'</div>'+tiles(D.quick)+'<h2>Checklists <small>saved to your account</small></h2>';const cols=mk('div',{class:'cols'});D.lists.filter(l=>l.period!=='week').forEach(l=>cols.append(list(l)));T.append(cols);
 renderLaunch();
 const rows=D.deadlines.map(x=>{let d=null,label=x.name;
  if(x.date)d=new Date(x.date+'T00:00:00');
  else if(x.rule==='ucr')d=nextOf([Y+'-12-01',(Y+1)+'-12-01']);
  else if(x.rule==='yearend')d=nextOf([Y+'-12-31',(Y+1)+'-12-31']);
  else if(x.rule==='ifta'){const r=nextOf([Y+'-01-31',Y+'-04-30',Y+'-07-31',Y+'-10-31',(Y+1)+'-01-31']);label='IFTA '+{0:'Q4',3:'Q1',6:'Q2',9:'Q3'}[r.getMonth()]+' return';d=bizDay(r)}
  return {d,label,x}}).sort((a,b)=>(a.d?a.d:9e15)-(b.d?b.d:9e15));
 $('#deadlines').innerHTML='<div class="q">'+esc(D.deadline_note)+'</div><div class="tw stack"><table><tbody>'+rows.map(r=>{let pill;if(r.d){const n=Math.round((r.d-d0)/864e5);pill='<span class="pill '+(n<=14?'p-bad':n<=60?'p-warn':'p-ok')+'">'+(n<0?(-n)+'d late':n===0?'today':n+' days')+'</span>'}else pill='<span class="pill p-mut">in DockRelay</span>';
  return '<tr><td class="t">'+(r.d?fmt(r.d):esc(r.x.per))+'</td><td><b>'+esc(r.label)+'</b></td><td class="who">'+esc(r.x.owner)+'</td><td>'+esc(r.x.do)+'</td><td>'+pill+'</td></tr>'}).join('')+'</tbody></table></div>';
 $('#kpis').innerHTML='<div class="q">'+esc(D.kpi_note)+'</div>'+D.kpis.map(g=>'<h2>'+esc(g.group)+'</h2><div class="tw"><table><tbody>'+g.rows.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td class="who">'+esc(r[1])+'</td><td class="t">'+esc(r[2])+'</td></tr>').join('')+'</tbody></table></div>').join('')+'<p class="note">'+esc(D.money_note)+'</p>';
 const P=D.port;$('#port').innerHTML='<h2>Garden City gates <small>check gaports.com before late moves</small></h2><div class="tw"><table><tbody>'+P.gates.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td class="t">Weekdays '+esc(r[1])+'</td><td class="t">Saturday '+esc(r[2])+'</td>'+(r[3]?'<td class="who">'+esc(r[3])+'</td>':'')+'</tr>').join('')+'</tbody></table></div><h2>Charge clocks</h2><div class="tw"><table><tbody>'+P.clocks.map(r=>'<tr><td><b>'+esc(r[0])+'</b></td><td class="who">'+esc(r[1])+'</td><td class="t">'+esc(r[2])+'</td></tr>').join('')+'</tbody></table></div><p class="note">'+esc(P.note)+'</p>';
 const W=$('#week');W.innerHTML='<div class="q">'+esc(D.week_note)+'</div>';const wc=mk('div',{class:'cols'});D.lists.filter(l=>l.period==='week').forEach(l=>wc.append(list(l)));W.append(wc)}


/* ---------- Launch tab (content comes from the database; Carter keeps the Library current and writes the briefs) ---------- */
const MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
let LMODE=(()=>{try{return localStorage.getItem('hq-lmode')||(MOBILE?'web':'app')}catch(e){return MOBILE?'web':'app'}})();
const cURL=u=>(LMODE==='app'&&!MOBILE&&/^https:\/\/claude\.ai\/(new|project\/|chat\/)/.test(u))?u.replace('https://','claude://'):u;
const la=u=>{const h=cURL(u);return h.startsWith('claude://')?'href="'+esc(h)+'"':'href="'+esc(h)+'" target="_blank" rel="noopener"'};
const GO={yard:'https://yard.2f-logistics.com/',phones:'https://yard.2f-logistics.com/',decisions:'https://yard.2f-logistics.com/'};
let LFILT='All';
function renderLaunch(){const L=DOC.launch;if(!L){$('#apps').innerHTML='<div class="q">Launch content not loaded.</div>';return}
 const hr=+sav().hour, b=BR.find(x=>x.kind===(hr>=17?'eod':'morning'))||BR[0];
 let h='';
 if(b){h+='<div class="brief"><h3>'+esc(b.title)+'<small>by Carter · '+new Date(b.at).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})+'</small></h3>'+
   b.lines.map(x=>{const g=x.go;const href=GO[g]?' href="'+GO[g]+'" target="_blank" rel="noopener"':(g?' href="#'+g+'" data-tab="'+g+'"':'');return '<a class="bl"'+href+'><i class="'+(x.tone||'ok')+'"></i><span>'+esc(x.t)+'</span></a>'}).join('')+'</div>'}
 else h+='<div class="q">Carter writes your <b>Morning plan</b> at 6:30 AM and an <b>End of day</b> recap at 6 PM. It will show here.</div>';
 h+='<input class="srch" id="lsrch" type="search" placeholder="Search apps, hubs, docs, prompts…" autocomplete="off"><div class="sres" id="lres" hidden></div>';
 h+='<h2>Apps</h2><div class="grid">'+L.pins.map(p=>'<a class="pinx" '+la(p[2])+'><b style="background:'+p[3]+'">'+esc(p[4])+'</b><div>'+esc(p[0])+'<small>'+esc(p[1])+'</small></div></a>').join('')+'</div>';
 h+='<h2>Ask Claude <small>drafts a new chat · you review and send</small></h2><div class="ask"><div class="chips" id="ltpl">'+L.templates.map((t,i)=>'<button class="chip" data-i="'+i+'">'+esc(t[0])+'</button>').join('')+'</div>'+
   '<textarea id="lprompt" placeholder="What do you need help with? Add the facts, or pick a template."></textarea>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="gobtn" id="lgo">Open in Claude</button><button class="ghost" id="lcopy">Copy</button>'+
   (MOBILE?'':'<button class="ghost" id="lmode">'+(LMODE==='app'?'Desktop app ✓':'Browser ✓')+'</button>')+'</div><div class="note" id="lmsg" style="margin:0;min-height:1em"></div></div>';
 h+='<h2>Claude hubs <small>start the chat inside one — filed automatically</small></h2><div class="grid">'+L.hubs.map(x=>'<a class="tile" '+la(x[1])+'><div class="k">+ chat</div><div class="n">'+esc(x[0])+'</div></a>').join('')+'</div>';
 h+='<h2>Library <small>Carter keeps this current</small></h2><div class="chips" id="lfilt">'+['All','Operations','Money','Company'].map(f=>'<button class="chip'+(f===LFILT?' on':'')+'">'+f+'</button>').join('')+'</div><div class="lib" id="llib"></div>';
 $('#apps').innerHTML=h;drawLib();wireLaunch()}
function drawLib(){$('#llib').innerHTML=DOC.launch.library.filter(x=>LFILT==='All'||x[2]===LFILT).map(x=>'<a '+la(x[1])+'>'+esc(x[0])+'<span>'+esc(x[3])+'</span></a>').join('')}
function wireLaunch(){const L=DOC.launch,ta=$('#lprompt');
 try{ta.value=localStorage.getItem('hq-draft')||''}catch(e){}
 ta.oninput=()=>{try{localStorage.setItem('hq-draft',ta.value)}catch(e){}};
 const say=t=>{$('#lmsg').textContent=t;setTimeout(()=>{if($('#lmsg'))$('#lmsg').textContent=''},6000)};
 $('#ltpl').onclick=e=>{const b=e.target.closest('button');if(!b)return;ta.value=L.templates[+b.dataset.i][2];ta.oninput();ta.focus()};
 const open=()=>{const v=ta.value.trim();if(v.length>8000){copy();say('Long prompt — copied. Paste it into Claude.');return}
   const h=cURL('https://claude.ai/new'+(v?'?q='+encodeURIComponent(v):''));if(h.startsWith('claude://')){location.href=h;say('Opening the Claude app. If nothing happens, tap Desktop app ✓ to switch to Browser.')}else{window.open(h,'_blank','noopener');say('Opened Claude with your draft — review and send.')}};
 const copy=()=>{const v=ta.value;if(!v)return say('Nothing to copy yet.');(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>say('Copied.'),()=>{ta.select();say('Press ⌘/Ctrl C to copy.')})};
 $('#lgo').onclick=open;$('#lcopy').onclick=copy;ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();open()}};
 if($('#lmode'))$('#lmode').onclick=()=>{LMODE=LMODE==='app'?'web':'app';try{localStorage.setItem('hq-lmode',LMODE)}catch(e){}renderLaunch()};
 $('#lfilt').onclick=e=>{const b=e.target.closest('button');if(!b)return;LFILT=b.textContent;document.querySelectorAll('#lfilt .chip').forEach(c=>c.classList.toggle('on',c===b));drawLib()};
 $('#apps').querySelectorAll('[data-tab]').forEach(a=>a.onclick=e=>{e.preventDefault();show(a.dataset.tab);scrollTo(0,0)});
 const idx=[...L.pins.map(p=>({t:p[0],u:p[2],k:'App',a:p[5]})),...L.hubs.map(x=>({t:x[0],u:x[1],k:'Hub',a:x[2]})),...L.library.map(x=>({t:x[0],u:x[1],k:x[3],a:[]})),...L.templates.map((t,i)=>({t:t[0],k:'Prompt',a:t[1],tpl:i}))];
 const sc=(it,s)=>{const t=it.t.toLowerCase(),al=(it.a||[]);if(al.includes(s))return 100;if(t.startsWith(s))return 80;if(al.some(x=>x.startsWith(s)))return 70;if(t.includes(s))return 60;let i=0;for(const ch of t){if(ch===s[i])i++;if(i===s.length)return 30}return 0};
 const q=$('#lsrch'),r=$('#lres');
 q.oninput=()=>{const s=q.value.trim().toLowerCase();if(!s){r.hidden=true;return}
  const hits=idx.map(it=>({it,v:sc(it,s)})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,7).map(x=>x.it);
  r.innerHTML=hits.map((x,i)=>x.tpl!=null?'<a href="#" data-tpl="'+x.tpl+'">'+esc(x.t)+'<span>Prompt</span></a>':'<a '+la(x.u)+'>'+esc(x.t)+'<span>'+esc(x.k)+'</span></a>').join('')+'<a href="#" data-ask="1">Ask Claude: “'+esc(q.value.trim())+'”<span>Claude</span></a>';r.hidden=false};
 r.onclick=e=>{const a=e.target.closest('a');if(!a)return;if(a.dataset.tpl!=null){e.preventDefault();ta.value=L.templates[+a.dataset.tpl][2];ta.oninput();ta.focus();r.hidden=true;q.value=''}else if(a.dataset.ask){e.preventDefault();ta.value=q.value.trim();ta.oninput();open()}};
 q.onkeydown=e=>{if(e.key==='Enter'){const a=r.querySelector('a');if(a){e.preventDefault();a.click()}}};
}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&$('#lsrch')){e.preventDefault();show('apps');$('#lsrch').focus()}});

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DOC)load()});
gate();
</script>
